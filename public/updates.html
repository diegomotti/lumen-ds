<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lumen DS - histórico de atualizações."
        data-i18n-attr="content:index.lumen-ds-historico-de" />
    <title data-i18n="index.lumen-ds-atualizacoes">Lumen DS | Atualizações</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumen DS" />
    <meta property="og:title" content="Lumen Design System" />
    <meta property="og:description" content="Lumen DS - documentação do design system." />
    <meta property="og:image" content="/favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
</head>

<body class="bg-pp-palette-white antialiased" data-page="updates">
    <a class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:bg-pp-palette-white focus:px-4 focus:py-3"
        href="#conteudo" data-i18n="common.pular-para-o-conteudo">Pular para o conteudo</a>

    <div data-component="header"></div>

    <div class="lg:grid lg:grid-cols-[17rem_minmax(0,1fr)]">
        <div data-component="sidebar"></div>

        <main id="conteudo" class="min-w-0 bg-pp-palette-white">
            <section class="border-b border-pp-palette-black/15 bg-pp-palette-secondary-50">
                <div class="mx-auto max-w-360 px-5 py-15 lg:px-6">
                    <p class="text-xs font-medium tracking-widest text-pp-palette-black/50"
                        data-i18n="index.lumen-ds-sistema">LUMEN DS / SISTEMA</p>
                    <div class="mt-5 grid gap-8 lg:grid-cols-[minmax(0,1fr)_20rem] lg:items-end">
                        <h1 class="text-6xl font-medium leading-[0.9] tracking-tighter text-pp-palette-black sm:text-8xl"
                            data-i18n="index.atualizacoes">Atualizações</h1>
                        <p class="max-w-96 text-base leading-6 text-pp-palette-black/60" data-i18n="index.novos-assets">
                        </p>
                    </div>
                </div>
            </section>

            <section class="mx-auto max-w-360 px-5 py-14 lg:px-10 lg:py-20" aria-labelledby="updates-title">
                <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_20rem] lg:items-end">
                    <div>
                        <p class="text-xs font-medium tracking-widest text-pp-palette-black/50"
                            data-i18n="index.historico">HISTÓRICO</p>
                        <h2 id="updates-title" class="mt-2 text-4xl font-medium tracking-tight text-pp-palette-black"
                            data-i18n="index.o-que-mudou">O que mudou</h2>
                    </div>
                </div>
                <div class="mt-10" id="updates-list" aria-live="polite">
                    <p class="border-t border-pp-palette-black/15 py-8 text-sm text-pp-palette-black/55"
                        data-i18n="index.carregando-atualizacoes">Carregando atualizações...</p>
                </div>
            </section>
        </main>
    </div>

    <div data-component="footer"></div>
    <script src="/i18n.js"></script>
    <script src="/app.js"></script>
</body>

</html>
